<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- FreeFlow Marketing Engine — UX mockup. Monochrome brand (BRAND.md):
       black canvas, white ink, grey hairlines, colour only on status. -->
  <defs>
    <clipPath id="win"><rect x="40" y="40" width="1520" height="1520" rx="18"/></clipPath>
  </defs>

  <!-- page backdrop -->
  <rect width="1600" height="1600" fill="#0a0a0a"/>

  <!-- browser window -->
  <g clip-path="url(#win)">
    <rect x="40" y="40" width="1520" height="1520" fill="#000000"/>

    <!-- title bar -->
    <rect x="40" y="40" width="1520" height="64" fill="#0d0d0d"/>
    <circle cx="76" cy="72" r="7" fill="#f87171"/>
    <circle cx="100" cy="72" r="7" fill="#fcd34d"/>
    <circle cx="124" cy="72" r="7" fill="#34d399"/>
    <rect x="560" y="56" width="480" height="32" rx="16" fill="#000000" stroke="#262626"/>
    <text x="800" y="78" fill="#a3a3a3" font-size="16" text-anchor="middle" letter-spacing="0.5">www.freeflow.website/marketing</text>

    <!-- app top nav -->
    <rect x="40" y="104" width="1520" height="60" fill="#0d0d0d"/>
    <line x1="40" y1="164" x2="1560" y2="164" stroke="#262626"/>
    <rect x="72" y="120" width="28" height="28" rx="7" fill="#ffffff"/>
    <path d="M80 143 V129 a3 3 0 0 1 3 -3 h11 Z" fill="#000000"/>
    <text x="120" y="143" fill="#ffffff" font-size="18" font-weight="700">FreeFlow</text>
    <g fill="#525252" font-size="15">
      <text x="270" y="143">Dashboard</text>
      <text x="380" y="143">Core</text>
      <text x="450" y="143">Research</text>
      <text x="560" y="143">Product</text>
      <text x="660" y="143">Pricing</text>
    </g>
    <text x="760" y="143" fill="#ffffff" font-size="15" font-weight="600">Marketing</text>
    <rect x="748" y="150" width="82" height="2" fill="#ffffff"/>
    <text x="1490" y="143" fill="#a3a3a3" font-size="15" text-anchor="end">Sign in</text>

    <!-- ===== page heading ===== -->
    <text x="88" y="232" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="3">MARKETING ENGINE</text>
    <text x="88" y="264" fill="#a3a3a3" font-size="17">Turn the product into posts — a validated persona, a generated campaign, and an A/B test. Every claim traceable, every AI line labelled.</text>

    <!-- =========================================================== -->
    <!-- ZONE 1 — INPUT / CONTEXT                                     -->
    <!-- =========================================================== -->
    <g>
      <rect x="88" y="300" width="30" height="20" rx="5" fill="#ffffff"/>
      <text x="103" y="315" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="130" y="315" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">INPUT · CONTEXT</text>
      <text x="1512" y="315" fill="#525252" font-size="13" text-anchor="end">what the copy is grounded in</text>
    </g>
    <!-- persona card -->
    <rect x="88" y="332" width="700" height="196" rx="12" fill="#0d0d0d" stroke="#262626"/>
    <text x="112" y="366" fill="#525252" font-size="12" letter-spacing="1.5">PERSONA · VALIDATED, NOT INVENTED</text>
    <text x="112" y="396" fill="#ffffff" font-size="19" font-weight="600">The per-project installer</text>
    <text x="112" y="424" fill="#a3a3a3" font-size="14">Installs software for small firms. Fixed fee per job, contract up</text>
    <text x="112" y="444" fill="#a3a3a3" font-size="14">front, billed on completion. Finds clients by cold outreach.</text>
    <rect x="112" y="462" width="4" height="48" fill="#ffffff"/>
    <text x="128" y="484" fill="#ffffff" font-size="15" font-style="italic">“kinda what u got just its annoying on mobile”</text>
    <text x="128" y="506" fill="#525252" font-size="12">— Week 2 validation interview, verbatim</text>
    <!-- brand card -->
    <rect x="812" y="332" width="700" height="196" rx="12" fill="#0d0d0d" stroke="#262626"/>
    <text x="836" y="366" fill="#525252" font-size="12" letter-spacing="1.5">BRAND · DOCUMENTED IN BRAND.md</text>
    <text x="836" y="396" fill="#ffffff" font-size="19" font-weight="600">Monochrome, plain, unwilling to flatter</text>
    <g font-size="12">
      <rect x="836" y="414" width="118" height="24" rx="12" fill="#000" stroke="#262626"/><circle cx="852" cy="426" r="5" fill="#60a5fa"/><text x="866" y="430" fill="#a3a3a3">In Progress</text>
      <rect x="962" y="414" width="132" height="24" rx="12" fill="#000" stroke="#262626"/><circle cx="978" cy="426" r="5" fill="#fcd34d"/><text x="992" y="430" fill="#a3a3a3">Awaiting Review</text>
      <rect x="1102" y="414" width="118" height="24" rx="12" fill="#000" stroke="#262626"/><circle cx="1118" cy="426" r="5" fill="#34d399"/><text x="1132" y="430" fill="#a3a3a3">Invoice Sent</text>
      <rect x="1228" y="414" width="96" height="24" rx="12" fill="#000" stroke="#262626"/><circle cx="1244" cy="426" r="5" fill="#f87171"/><text x="1258" y="430" fill="#a3a3a3">Overdue</text>
    </g>
    <text x="836" y="466" fill="#525252" font-size="13">Black-and-white canvas; colour reserved for project status. Voice:</text>
    <text x="836" y="490" fill="#a3a3a3" font-size="13">— Say what it is before asking.  — Concrete over aspirational.</text>
    <text x="836" y="510" fill="#a3a3a3" font-size="13">— Never claim what isn't built.  — Honest about being free.</text>

    <!-- =========================================================== -->
    <!-- ZONE 2 — AI / AGENT OUTPUT                                   -->
    <!-- =========================================================== -->
    <g>
      <rect x="88" y="560" width="30" height="20" rx="5" fill="#ffffff"/>
      <text x="103" y="575" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="130" y="575" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">AI / AGENT OUTPUT</text>
      <text x="1512" y="575" fill="#525252" font-size="13" text-anchor="end">generated live · labelled by provenance</text>
    </g>
    <!-- toolbar -->
    <rect x="88" y="592" width="150" height="40" rx="9" fill="#ffffff"/>
    <text x="163" y="617" fill="#000000" font-size="15" font-weight="700" text-anchor="middle">Generate live</text>
    <rect x="250" y="592" width="120" height="40" rx="9" fill="#000" stroke="#262626"/>
    <text x="310" y="617" fill="#a3a3a3" font-size="15" text-anchor="middle">Export CSV</text>
    <rect x="1360" y="600" width="152" height="26" rx="13" fill="#0b2a1e" stroke="#1f5a41"/>
    <circle cx="1380" cy="613" r="5" fill="#34d399"/>
    <text x="1394" y="618" fill="#6ee7b7" font-size="13">AI-generated · 10 posts</text>
    <!-- three post cards -->
    <g>
      <!-- card 1 -->
      <rect x="88" y="648" width="462" height="196" rx="12" fill="#0d0d0d" stroke="#262626"/>
      <text x="112" y="682" fill="#525252" font-size="12" letter-spacing="1.5">LINKEDIN</text>
      <rect x="452" y="668" width="76" height="22" rx="11" fill="#0b2a1e" stroke="#1f5a41"/><text x="490" y="683" fill="#6ee7b7" font-size="11" text-anchor="middle">AI-generated</text>
      <text x="112" y="716" fill="#ffffff" font-size="15" font-weight="600">Most trackers answer "what am I owed?"</text>
      <text x="112" y="742" fill="#a3a3a3" font-size="13">You already know that. What you can't see is next</text>
      <text x="112" y="762" fill="#a3a3a3" font-size="13">month — FreeFlow forecasts the pipeline, weighted.</text>
      <text x="112" y="800" fill="#525252" font-size="13">Try it free: freeflow.website</text>
      <line x1="112" y1="814" x2="526" y2="814" stroke="#262626"/>
      <text x="112" y="834" fill="#a3a3a3" font-size="13">Copy   ·   Save</text>
      <!-- card 2 -->
      <rect x="569" y="648" width="462" height="196" rx="12" fill="#0d0d0d" stroke="#262626"/>
      <text x="593" y="682" fill="#525252" font-size="12" letter-spacing="1.5">X</text>
      <rect x="933" y="668" width="76" height="22" rx="11" fill="#0b2a1e" stroke="#1f5a41"/><text x="971" y="683" fill="#6ee7b7" font-size="11" text-anchor="middle">AI-generated</text>
      <text x="593" y="716" fill="#ffffff" font-size="15" font-weight="600">Priced per job, not per hour? Same.</text>
      <text x="593" y="742" fill="#a3a3a3" font-size="13">FreeFlow opens on a fixed-fee project by default.</text>
      <text x="593" y="762" fill="#a3a3a3" font-size="13">Don't fight the form to bill how you work.</text>
      <text x="593" y="800" fill="#525252" font-size="13">freeflow.website</text>
      <line x1="593" y1="814" x2="1007" y2="814" stroke="#262626"/>
      <text x="593" y="834" fill="#a3a3a3" font-size="13">Copy   ·   Save</text>
      <!-- card 3 (video script) -->
      <rect x="1050" y="648" width="462" height="196" rx="12" fill="#0d0d0d" stroke="#262626"/>
      <text x="1074" y="680" fill="#ffffff" font-size="15" font-weight="600">Free while we grow</text>
      <text x="1476" y="680" fill="#525252" font-size="13" text-anchor="end">30s</text>
      <text x="1074" y="710" fill="#525252" font-size="11" letter-spacing="1">HOOK</text>
      <text x="1074" y="730" fill="#a3a3a3" font-size="13">FreeFlow has no paywall. None.</text>
      <text x="1074" y="756" fill="#525252" font-size="11" letter-spacing="1">CTA</text>
      <text x="1074" y="776" fill="#a3a3a3" font-size="13">freeflow.website</text>
      <rect x="1074" y="792" width="88" height="22" rx="11" fill="#0b2a1e" stroke="#1f5a41"/><text x="1118" y="807" fill="#6ee7b7" font-size="11" text-anchor="middle">video script</text>
      <line x1="1074" y1="822" x2="1488" y2="822" stroke="#262626"/>
      <text x="1074" y="840" fill="#525252" font-size="12" font-style="italic">1 of 3 short-form scripts</text>
    </g>

    <!-- =========================================================== -->
    <!-- ZONE 3 — SAVED RESULTS  +  14-DAY CALENDAR                   -->
    <!-- =========================================================== -->
    <g>
      <rect x="88" y="876" width="30" height="20" rx="5" fill="#ffffff"/>
      <text x="103" y="891" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="130" y="891" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">SAVED RESULTS</text>
      <text x="1512" y="891" fill="#525252" font-size="13" text-anchor="end">per account · Supabase, RLS</text>
    </g>
    <!-- saved rows -->
    <g font-size="13">
      <rect x="88" y="908" width="700" height="40" rx="9" fill="#0d0d0d" stroke="#262626"/>
      <text x="112" y="932" fill="#525252" letter-spacing="1">POST</text><text x="200" y="932" fill="#a3a3a3">Most trackers answer "what am I owed?"…</text><text x="764" y="932" fill="#525252" text-anchor="end">09/29</text>
      <rect x="88" y="956" width="700" height="40" rx="9" fill="#0d0d0d" stroke="#262626"/>
      <text x="112" y="980" fill="#525252" letter-spacing="1">HEADLINE</text><text x="220" y="980" fill="#a3a3a3">See next month's cash before it arrives.</text><text x="764" y="980" fill="#525252" text-anchor="end">09/29</text>
    </g>
    <!-- calendar (compact 14-day) -->
    <text x="812" y="900" fill="#525252" font-size="12" letter-spacing="1.5">14-DAY CALENDAR</text>
    <g>
      <!-- 2 rows x 7 -->
      <g>
        <!-- generated positions -->
        <!-- row1 -->
        <g>
          <rect x="812" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="824" y="932" fill="#a3a3a3" font-size="12">D1</text>
          <rect x="912" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="924" y="932" fill="#a3a3a3" font-size="12">D2</text>
          <rect x="1012" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1024" y="932" fill="#a3a3a3" font-size="12">D3</text>
          <rect x="1112" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#3a3a3a"/><text x="1124" y="932" fill="#ffffff" font-size="12">D4▸</text>
          <rect x="1212" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1224" y="932" fill="#a3a3a3" font-size="12">D5</text>
          <rect x="1312" y="908" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1324" y="932" fill="#a3a3a3" font-size="12">D6</text>
          <rect x="1412" y="908" width="100" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1424" y="932" fill="#a3a3a3" font-size="12">D7</text>
        </g>
        <!-- row2 -->
        <g>
          <rect x="812" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="824" y="980" fill="#a3a3a3" font-size="12">D8</text>
          <rect x="912" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#3a3a3a"/><text x="924" y="980" fill="#ffffff" font-size="12">D9▸</text>
          <rect x="1012" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1024" y="980" fill="#a3a3a3" font-size="12">D10</text>
          <rect x="1112" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1124" y="980" fill="#a3a3a3" font-size="12">D11</text>
          <rect x="1212" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1224" y="980" fill="#a3a3a3" font-size="12">D12</text>
          <rect x="1312" y="956" width="92" height="40" rx="7" fill="#0d0d0d" stroke="#262626"/><text x="1324" y="980" fill="#a3a3a3" font-size="12">D13</text>
          <rect x="1412" y="956" width="100" height="40" rx="7" fill="#0d0d0d" stroke="#3a3a3a"/><text x="1424" y="980" fill="#ffffff" font-size="12">D14▸</text>
        </g>
      </g>
      <text x="812" y="1018" fill="#525252" font-size="11">▸ = video slot, spread across the fortnight</text>
    </g>

    <!-- =========================================================== -->
    <!-- ZONE 4 — TESTING EVIDENCE (A/B + software tests)            -->
    <!-- =========================================================== -->
    <g>
      <rect x="88" y="1052" width="30" height="20" rx="5" fill="#ffffff"/>
      <text x="103" y="1067" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">4</text>
      <text x="130" y="1067" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">TESTING EVIDENCE</text>
      <text x="1512" y="1067" fill="#525252" font-size="13" text-anchor="end">2 A/B tests · 3 software tests</text>
    </g>
    <!-- A/B test card 1 -->
    <rect x="88" y="1084" width="462" height="180" rx="12" fill="#0d0d0d" stroke="#262626"/>
    <text x="112" y="1116" fill="#525252" font-size="12" letter-spacing="1.5">TEST: VALUE-PROP</text>
    <text x="512" y="1116" fill="#a3a3a3" font-size="12" text-anchor="end">Save winner</text>
    <rect x="112" y="1130" width="414" height="46" rx="9" fill="#141414" stroke="#ffffff"/>
    <text x="126" y="1150" fill="#525252" font-size="10" letter-spacing="1">WINNER</text>
    <text x="126" y="1168" fill="#ffffff" font-size="14">Know what is coming, not just what you're owed.</text>
    <rect x="112" y="1184" width="414" height="46" rx="9" fill="#000" stroke="#262626"/>
    <text x="126" y="1204" fill="#525252" font-size="10" letter-spacing="1">PICK</text>
    <text x="126" y="1222" fill="#a3a3a3" font-size="14">See next month's cash before it arrives.</text>
    <!-- A/B test card 2 -->
    <rect x="569" y="1084" width="462" height="180" rx="12" fill="#0d0d0d" stroke="#262626"/>
    <text x="593" y="1116" fill="#525252" font-size="12" letter-spacing="1.5">TEST: AUDIENCE</text>
    <text x="993" y="1116" fill="#a3a3a3" font-size="12" text-anchor="end">Save winner</text>
    <rect x="593" y="1130" width="414" height="46" rx="9" fill="#141414" stroke="#ffffff"/>
    <text x="607" y="1150" fill="#525252" font-size="10" letter-spacing="1">WINNER</text>
    <text x="607" y="1168" fill="#ffffff" font-size="14">For freelancers who bill per project.</text>
    <rect x="593" y="1184" width="414" height="46" rx="9" fill="#000" stroke="#262626"/>
    <text x="607" y="1204" fill="#525252" font-size="10" letter-spacing="1">PICK</text>
    <text x="607" y="1222" fill="#a3a3a3" font-size="14">The forecast your invoice app forgot.</text>
    <!-- software test checklist -->
    <rect x="1050" y="1084" width="462" height="180" rx="12" fill="#0d0d0d" stroke="#262626"/>
    <text x="1074" y="1116" fill="#525252" font-size="12" letter-spacing="1.5">SOFTWARE TESTS · npm run test:marketing</text>
    <g font-size="13">
      <text x="1074" y="1146" fill="#34d399">✓</text><text x="1096" y="1146" fill="#a3a3a3">seed campaign complete &amp; valid (10/3/14)</text>
      <text x="1074" y="1172" fill="#34d399">✓</text><text x="1096" y="1172" fill="#a3a3a3">empty input → valid skeleton, no crash</text>
      <text x="1074" y="1198" fill="#34d399">✓</text><text x="1096" y="1198" fill="#a3a3a3">save route requires a user (401)</text>
      <text x="1074" y="1224" fill="#34d399">✓</text><text x="1096" y="1224" fill="#a3a3a3">A/B winner selects &amp; switches</text>
    </g>
    <text x="1074" y="1250" fill="#525252" font-size="12">22 passed, 0 failed</text>

    <!-- footer strip -->
    <line x1="88" y1="1300" x2="1512" y2="1300" stroke="#262626"/>
    <text x="88" y="1330" fill="#525252" font-size="13">FreeFlow · Marketing Engine + Content System — Week 4 · monochrome brand, zero new dependencies</text>
    <text x="1512" y="1330" fill="#525252" font-size="13" text-anchor="end">Next.js · Tailwind · Supabase · claude-opus-5</text>
  </g>

  <!-- window border -->
  <rect x="40" y="40" width="1520" height="1520" rx="18" fill="none" stroke="#262626" stroke-width="1.5"/>
</svg>
