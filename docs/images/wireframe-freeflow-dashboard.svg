    <text x="174" y="632" fill="#525252" font-size="9.5" letter-spacing="1.5">WHAT CHANGED, AND WHY</text>

    <g font-size="10.5">
      <text x="174" y="662" fill="#ffffff">Primary navigation moved into the top bar.</text>
      <text x="174" y="679" fill="#a3a3a3">The 64px icon rail spent scarce phone width on chrome. &#8220;Annoying on mobile&#8221; — Week 2 interviewee.</text>

      <text x="174" y="727" fill="#ffffff">The sidebar holds sections of the page, not of the product.</text>
      <text x="174" y="744" fill="#a3a3a3">On /research and /pricing those are the tabs. Pages with no sub-sections get no sidebar at all.</text>

      <text x="174" y="792" fill="#ffffff">Progress is derived, never invented.</text>
      <text x="174" y="809" fill="#a3a3a3">There is no &#8220;percent complete&#8221; field, so the bar reads pipeline stage plus payment:</text>
      <text x="174" y="825" fill="#a3a3a3">Contract Signed 10 &#183; In Progress 30 &#183; Awaiting Review 55 &#183; Invoiced 80 &#183; Paid 100.</text>

      <text x="174" y="873" fill="#ffffff">One colour survives the monochrome pass.</text>
      <text x="174" y="890" fill="#a3a3a3">Overdue is the only status that means money is late. The word is always printed, so nothing</text>
      <text x="174" y="906" fill="#a3a3a3">depends on seeing the colour.</text>

      <text x="174" y="954" fill="#ffffff">Contract Signed is a new first stage.</text>
      <text x="174" y="971" fill="#a3a3a3">&#8220;I always have a contract signed beforehand and in case I ever need to escalate.&#8221; The signature</text>
      <text x="174" y="987" fill="#a3a3a3">he credits with never being stood up had nowhere to live.</text>

      <text x="174" y="1035" fill="#ffffff">Mark paid closes a hole that had been open since Week 0.</text>
      <text x="174" y="1052" fill="#a3a3a3">The dashboard computed This Month&#39;s Earnings from is_paid with no way to set it.</text>
    </g>

    <text x="174" y="1120" fill="#525252" font-size="9">FreeFlow &#183; dashboard, as built &#183; www.freeflow.website</text>
